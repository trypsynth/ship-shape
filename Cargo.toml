[package]
name = "ship-shape"
version = "0.4.1"
edition = "2024"
description = "Universal auto-updater for wxDragon desktop apps"
license = "MIT"
repository = "https://github.com/trypsynth/ship-shape"
readme = "README.md"
keywords = ["updater", "wxdragon", "auto-update", "desktop", "github-releases"]
categories = ["gui"]
exclude = ["examples/"]

[package.metadata.patois]
translatable = true

[dependencies]
homeport = "0.1.0"
minisign-verify = "0.2.5"
patois = "0.2.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
wx-utils = "0.4.2"
# default-features = false so this does not decide for the application
# which parts of wxWidgets get built; nothing here needs any of them.
wxdragon = { version = "0.9.22", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3.27.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# ring and dirs pin different windows-sys versions, which a library has no say in.
multiple_crate_versions = "allow"
