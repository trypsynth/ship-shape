[package]
name = "ship-shape"
version = "0.1.2"
edition = "2024"
links = "ship_shape_i18n"
build = "build.rs"
description = "Universal auto-updater for wxDragon desktop apps"
license = "MIT"
repository = "https://github.com/trypsynth/ship-shape"
readme = "README.md"
keywords = ["updater", "wxdragon", "auto-update", "desktop", "github-releases"]
categories = ["gui"]

[features]
default = []
ui = ["dep:pulldown-cmark", "dep:wxdragon"]

[dependencies]
minisign-verify = "0.2.5"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
wxdragon = { version = "0.9.16", optional = true }
